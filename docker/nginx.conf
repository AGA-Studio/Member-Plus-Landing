server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Assets que Astro emite con hash en el nombre: nunca cambian.
    location /_astro/ {
        expires max;
        try_files $uri =404;
    }

    # Capturas y logos servidos desde public/: el nombre no cambia, así que el
    # cache es corto o una imagen nueva tarda días en verse.
    location /screens/ {
        expires 1h;
        try_files $uri =404;
    }

    location /brand/ {
        expires 1h;
        try_files $uri =404;
    }

    # Sonda del HEALTHCHECK de la imagen (y de Coolify, si la lee).
    location = /healthz.txt {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    # Astro genera un index.html por directorio: /privacidad y /privacidad/
    # sirven el mismo archivo. El canonical que emite Astro es sin barra final.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
